on:
  push:
    branches:
      - main
      - alpha

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-bats
        uses: bats-core/bats-action@3.0.1
      - run: make test
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}

  release:
    needs:
      - check
      - test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install semantic-release@24.2.3 @semantic-release/exec@7.0.3 -D
      - run: npx semantic-release
        env:
          GH_TOKEN: ${{ github.token }}
