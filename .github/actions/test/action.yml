name: test
description: Run tests
runs:
  using: composite
  steps:
    - id: setup-bats
      uses: bats-core/bats-action@3.0.1
    - name: set up test environment
      shell: bash
      run: |
        chmod +x ./test/test_env_setup.sh
        sudo ./test/test_env_setup.sh
    - run: make test
      shell: bash
      env:
        BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
